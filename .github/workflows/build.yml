name: Build Mifer

on:
  push:
    tags:
      - 'v*'
    
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, linux]
        goarch: [amd64, arm64]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 编译可执行文件
        run: |
          VERSION="${{ github.ref_name }}"
          EXE_EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXE_EXT=".exe"
          fi
          OUTPUT="mifer${EXE_EXT}"
          echo "Building ${OUTPUT} for ${{ matrix.goos }}/${{ matrix.goarch }} (${VERSION})"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-s -w" -o "${OUTPUT}" ./cmd/main
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "OUTPUT=${OUTPUT}" >> $GITHUB_ENV

      - name: 打包 Windows (.zip)
        if: matrix.goos == 'windows'
        run: |
          ARTIFACT="mifer-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.zip"
          zip -j "$ARTIFACT" "$OUTPUT" 使用教程.md
          echo "ARTIFACT=${ARTIFACT}" >> $GITHUB_ENV

      - name: 打包 Linux (.tar.gz)
        if: matrix.goos == 'linux'
        run: |
          ARTIFACT="mifer-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar -czf "$ARTIFACT" "$OUTPUT" 使用教程.md
          echo "ARTIFACT=${ARTIFACT}" >> $GITHUB_ENV

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: mifer-${{ env.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ARTIFACT }}
          retention-days: 30
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## 🚀 新功能：QQ Bot
            - QQ 消息通道客户端 `qq/` 包，通过 NapCatQQ（OneBot v11 协议桥）收发 QQ 消息
            - 支持私聊和群聊（@ 检测），每个用户独立记忆会话（层级 Session ID）
            - Agent Function Calling 工具 `qq_send_message`，LLM 可主动发送 QQ 消息
            - 工具确认自动处理：QQ 通道中 `qq_send_message` 自动通过，其他工具自动拒绝
            - docker-compose 新增 NapCatQQ 服务，一键启动 QQ Bot 桥接
            - 记忆系统支持层级路径（`qq_private/12345`、`qq_group/789/12345`）

            ## 🔧 使用方式
            1. `docker-compose up -d napcat` 启动 NapCatQQ
            2. 浏览器打开 `http://localhost:6099` 扫码登录 QQ
            3. 网络配置 → 新建 WebSocket 服务端 → 主机 0.0.0.0 端口 3001 → 启用
            4. 配置 `qq.enabled: true` 和 `qq.bot.qq: 你的QQ号`
            5. `go run ./cmd/main` 启动 Mifer
          files: artifacts/**/*
          draft: false
          prerelease: false

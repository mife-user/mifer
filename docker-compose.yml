# ============================================================
# Mifer — 基础设施服务（供本地 go run 调用）
# ============================================================
# 启动方式：
#   docker-compose up -d              # 启动全部服务
#   docker-compose up -d qdrant       # 仅启动指定服务
#   docker-compose up -d napcat       # 仅启动 QQ Bot 桥接
#
# 服务端口（宿主机）：
#   Qdrant   HTTP API  → localhost:6333
#   Qdrant   gRPC      → localhost:6334
#   SearXNG  Web UI    → localhost:18080
#   SearXNG  JSON API  → localhost:18080/search?q=...&format=json
#   NapCat   WebSocket → localhost:3001   （OneBot v11，Mifer QQ adapter 连接）
#   NapCat   WebUI     → localhost:6099   （扫码登录 + 网络配置）
# ============================================================

services:
  # ==========================================
  # Qdrant — 向量数据库（RAG 知识库存储）
  # ==========================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mifer-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - mifer-net

  # ==========================================
  # SearXNG — 元搜索引擎（聚合 Google/Bing/DuckDuckGo/百度）
  # ==========================================
  # Mifer 通过 JSON API 调用: http://localhost:18080/search?q=...&format=json&categories=general
  # 无需 API Key，完全免费
  searxng:
    image: searxng/searxng:latest
    container_name: mifer-searxng
    ports:
      - "18080:8080"
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng_data:/etc/searxng/
      - searxng_cache:/var/cache/searxng/
    environment:
      - SEARXNG_BASE_URL=http://localhost:18080/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    restart: unless-stopped
    networks:
      - mifer-net

  # ==========================================
  # Ollama — 本地嵌入模型服务（可选）
  # ==========================================
  # 首次启动后拉取模型:
  #   docker-compose exec ollama ollama pull nomic-embed-text
  # 然后修改 Mifer 配置:
  #   ai.backends.embedder.base_url: http://localhost:11434
  #
  ollama:
    image: ollama/ollama:latest
    container_name: mifer-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - mifer-net

  # ==========================================
  # NapCatQQ — QQ Bot 协议桥（OneBot v11）
  # ==========================================
  # 正向 WebSocket 服务端模式：NapCat 监听 3001，Mifer QQ adapter 主动连接。
  # 首次启动后访问 http://localhost:6099 扫码登录，并在网络配置中：
  #   - 新建 WebSocket 服务端 → 主机 0.0.0.0 端口 3001 → 启用
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: mifer-napcat
    environment:
      - ACCOUNT=${NAPCAT_QQ:-0}        # Bot QQ 号，或通过 .env 文件设置 NAPCAT_QQ=你的QQ号
      - TZ=Asia/Shanghai
      - WS_ENABLE=true                 # 启用正向 WebSocket 服务端
      - WS_PORT=3001                   # WebSocket 监听端口
      - WEBUI_TOKEN=${NAPCAT_TOKEN:-}  # WebUI 登录密码（可选，不设则启动日志中随机生成）
      - MESSAGE_POST_FORMAT=array
      - NAPCAT_UID=0
      - NAPCAT_GID=0
    ports:
      - "3001:3001"                    # OneBot WebSocket（Mifer 连接此端口）
      - "6099:6099"                    # WebUI 管理面板（扫码登录）
    volumes:
      - napcat_qq:/app/.config/QQ      # QQ 登录态持久化
      - napcat_config:/app/napcat/config  # NapCat 配置持久化
      - napcat_logs:/app/napcat/logs   # 日志
    restart: unless-stopped
    networks:
      - mifer-net

volumes:
  qdrant_data:
    name: mifer_qdrant_data
  ollama_data:
    name: mifer_ollama_data
  searxng_data:
    name: mifer_searxng_data
  searxng_cache:
    name: mifer_searxng_cache
  napcat_qq:
    name: mifer_napcat_qq
  napcat_config:
    name: mifer_napcat_config
  napcat_logs:
    name: mifer_napcat_logs
networks:
  mifer-net:
    name: mifer-net
    driver: bridge

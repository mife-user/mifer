name: Build Mifer

on:
  push:
    tags:
      - 'v*'
    
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, linux]
        goarch: [amd64, arm64]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 编译可执行文件
        run: |
          VERSION="${{ github.ref_name }}"
          EXE_EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXE_EXT=".exe"
          fi
          OUTPUT="mifer${EXE_EXT}"
          echo "Building ${OUTPUT} for ${{ matrix.goos }}/${{ matrix.goarch }} (${VERSION})"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-s -w" -o "${OUTPUT}" ./cmd/main
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "OUTPUT=${OUTPUT}" >> $GITHUB_ENV

      - name: 打包 Windows (.zip)
        if: matrix.goos == 'windows'
        run: |
          ARTIFACT="mifer-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.zip"
          zip -j "$ARTIFACT" "$OUTPUT" 使用教程.md docker-compose.yml
          zip -r "$ARTIFACT" docker/
          echo "ARTIFACT=${ARTIFACT}" >> $GITHUB_ENV

      - name: 打包 Linux (.tar.gz)
        if: matrix.goos == 'linux'
        run: |
          ARTIFACT="mifer-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar -czf "$ARTIFACT" "$OUTPUT" 使用教程.md docker-compose.yml docker/
          echo "ARTIFACT=${ARTIFACT}" >> $GITHUB_ENV

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: mifer-${{ env.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ARTIFACT }}
          retention-days: 30
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## 🚀 QQ Bot 优化
            - QQ 通道新增独立 MiQQ Agent（无工具，纯文本对话），避免非 QQ 工具被拒导致死循环
            - 记忆切换原子化：Chat 请求体支持 `session_id`，SwitchSession + Chat 单次请求完成
            - 移除 `internal/ai/tools/qq/Sender` 全局变量，改为构造函数闭包注入
            - `onebotSender` 从 bootstrap 迁移至 `qq/onebot_http.go`，导出 `OnebotHTTPSender`
            - `oneBotEvent` 新增 `IsPrivate()`/`IsGroup()`/`IsMessage()` 语义方法
            - 工具包重命名 `qq` → `qqtools`，消除与顶层 `qq/` 包名冲突
            - `Config` 新增 `AllowedTools` 配置字段，替代硬编码白名单

            ## 📸 文件快照优化
            - `SaveRound` 仅在文件实际变更时写入 manifest，无操作对话不再产生空快照
            - `RestoreToRound` 改为查找最近可用快照，兼容 SaveRound 跳过的轮次
            - `RemoveRound` 对跳过轮次静默容错

            ## 🧹 代码质量
            - `callback.ToolCallbackHandler` 全局变量改为 `NewHandler(cb)` 工厂，闭包传递 callback
            - confirm 中间件的 `sendConfirmEvent`/`awaitConfirmation` callback 改为显式参数
            - 默认系统提示词结构化重写，去除冗余和环境假设

            ## 🔧 使用方式
            1. `docker-compose up -d napcat` 启动 NapCatQQ
            2. 浏览器打开 `http://localhost:6099` 扫码登录 QQ
            3. 网络配置 → 新建 WebSocket 服务端 → 主机 0.0.0.0 端口 3001 → 启用
            4. 配置 `qq.enabled: true` 和 `qq.bot.qq: 你的QQ号`
            5. `go run ./cmd/main` 启动 Mifer
          files: artifacts/**/*
          draft: false
          prerelease: false

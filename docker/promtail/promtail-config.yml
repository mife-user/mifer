# Promtail 配置 — 采集 Mifer 日志并发送到 Loki
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /data/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: mifer-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: mifer
          __path__: /var/log/mifer/*.log
    pipeline_stages:
      # JSON 解析（Mifer 使用 NewJSONEncoder，每行一条 JSON）
      - json:
          expressions:
            time: time
            level: level
            caller: caller
            msg: msg
      - labels:
          level:
      - timestamp:
          source: time
          format: "01-02 15:04:05.000"
      - output:
          source: msg

  - job_name: mifer-gin-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: mifer-gin
          __path__: /var/log/mifer/gin.log

# ============================================================
# Mifer — 基础设施服务（供本地 go run 调用）
# ============================================================
# 启动方式：
#   docker-compose up -d              # 启动全部服务
#   docker-compose up -d qdrant       # 仅启动指定服务
#   docker-compose up -d napcat       # 仅启动 QQ Bot 桥接
#
# 服务端口（宿主机）：
#   Qdrant   HTTP API  → localhost:6333
#   Qdrant   gRPC      → localhost:6334
#   SearXNG  Web UI    → localhost:18080
#   SearXNG  JSON API  → localhost:18080/search?q=...&format=json
# ============================================================

services:
  # ==========================================
  # Qdrant — 向量数据库（RAG 知识库存储）
  # ==========================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mifer-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - mifer-net

  # ==========================================
  # SearXNG — 元搜索引擎（聚合 Google/Bing/DuckDuckGo/百度）
  # ==========================================
  # Mifer 通过 JSON API 调用: http://localhost:18080/search?q=...&format=json&categories=general
  # 无需 API Key，完全免费
  searxng:
    image: searxng/searxng:latest
    container_name: mifer-searxng
    ports:
      - "18080:8080"
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng_data:/etc/searxng/
      - searxng_cache:/var/cache/searxng/
    environment:
      - SEARXNG_BASE_URL=http://localhost:18080/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    restart: unless-stopped
    networks:
      - mifer-net

  # ==========================================
  # Ollama — 本地嵌入模型服务（可选）
  # ==========================================
  # 首次启动后拉取模型:
  #   docker-compose exec ollama ollama pull nomic-embed-text
  # 然后修改 Mifer 配置:
  #   ai.backends.embedder.base_url: http://localhost:11434
  #
  ollama:
    image: ollama/ollama:latest
    container_name: mifer-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - mifer-net

  # ==========================================
  # Loki — 日志聚合服务（Grafana Loki）
  # ==========================================
  # 接收 Promtail 推送的日志，提供 LogQL 查询接口
  # Web UI: http://localhost:3100
  loki:
    image: grafana/loki:latest
    container_name: mifer-loki
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - mifer-net

  # ==========================================
  # Promtail — 日志采集代理
  # ==========================================
  # 采集 Mifer 日志文件并推送到 Loki
  promtail:
    image: grafana/promtail:latest
    container_name: mifer-promtail
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - ~/.mifer/logs:/var/log/mifer:ro
      - promtail_data:/data
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    depends_on:
      - loki
    networks:
      - mifer-net

  # ==========================================
  # Grafana — 监控可视化面板
  # ==========================================
  # Loki 已预配置为默认数据源，启动后即可查询日志
  # Web UI: http://localhost:3000 (admin / admin)
  grafana:
    image: grafana/grafana:latest
    container_name: mifer-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped
    depends_on:
      - loki
    networks:
      - mifer-net

volumes:
  qdrant_data:
    name: mifer_qdrant_data
  ollama_data:
    name: mifer_ollama_data
  searxng_data:
    name: mifer_searxng_data
  searxng_cache:
    name: mifer_searxng_cache
  loki_data:
    name: mifer_loki_data
  promtail_data:
    name: mifer_promtail_data
  grafana_data:
    name: mifer_grafana_data

networks:
  mifer-net:
    name: mifer-net
    driver: bridge

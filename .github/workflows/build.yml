name: Build Mifer

on:
  push:
    tags:
      - 'v*'
    
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, linux]
        goarch: [amd64, arm64]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 编译可执行文件
        run: |
          VERSION="${{ github.ref_name }}"
          EXE_EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXE_EXT=".exe"
          fi
          OUTPUT="mifer${EXE_EXT}"
          echo "Building ${OUTPUT} for ${{ matrix.goos }}/${{ matrix.goarch }} (${VERSION})"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-s -w" -o "${OUTPUT}" ./cmd/main
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "OUTPUT=${OUTPUT}" >> $GITHUB_ENV

      - name: 打包 Windows (.zip)
        if: matrix.goos == 'windows'
        run: |
          ARTIFACT="mifer-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.zip"
          zip -j "$ARTIFACT" "$OUTPUT" 使用教程.md docker-compose.yml
          zip -r "$ARTIFACT" docker/
          echo "ARTIFACT=${ARTIFACT}" >> $GITHUB_ENV

      - name: 打包 Linux (.tar.gz)
        if: matrix.goos == 'linux'
        run: |
          ARTIFACT="mifer-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar -czf "$ARTIFACT" "$OUTPUT" 使用教程.md docker-compose.yml docker/
          echo "ARTIFACT=${ARTIFACT}" >> $GITHUB_ENV

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: mifer-${{ env.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ARTIFACT }}
          retention-days: 30
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## 🗑 移除 NapCat QQ Bot 集成
            - **删除 QQ Bot 子系统** — 移除 `qq/` 目录下所有代码（NapCatQQ WebSocket 客户端、OneBot 消息发送器、CQ 码解析器）
            - **移除 QQ 工具** — 删除 `internal/ai/tools/qq/` 及 `qq_send_message` 工具定义
            - **清理 QQ 通道** — 移除 `QQRunner`、`MiQQ` Agent、`QQAgent` 及相关配置引用
            - **移除 QQ 配置** — `docker-compose.yml` 中删除 NapCatQQ 服务，清理 `config.dev.yaml` 默认配置中的 QQ 相关项
            - **简化 Agent 初始化** — `Humen` 结构体移除 `QQAgent` 字段，`pickRunner` 不再按 QQ 通道分发

            ## 📊 日志系统优化
            - **新增 TraceID 支持** — 日志添加 traceID 字段，便于请求链路追踪和问题排查
            - **移除 sessionID** — 从 traceMiddleware 和 logger 中移除 sessionID 相关代码，简化日志上下文
            - **精简通道字段** — 优化日志记录，移除不必要的通道（channel）字段，减少冗余信息

            ## 🏗 基础设施调整
            - **Loki/Promtail 配置更新** — 数据存储路径调整为 `/loki`（Loki 数据）和 `/data`（Promtail 位置记录），优化存储结构
          files: artifacts/**/*
          draft: false
          prerelease: false

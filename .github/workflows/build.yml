name: Build Mifer

on:
  push:
    tags:
      - 'v*'
    
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, linux]
        goarch: [amd64, arm64]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 编译可执行文件
        run: |
          VERSION="${{ github.ref_name }}"
          EXE_EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXE_EXT=".exe"
          fi
          OUTPUT="mifer${EXE_EXT}"
          echo "Building ${OUTPUT} for ${{ matrix.goos }}/${{ matrix.goarch }} (${VERSION})"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-s -w" -o "${OUTPUT}" ./cmd/main
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "OUTPUT=${OUTPUT}" >> $GITHUB_ENV

      - name: 打包 Windows (.zip)
        if: matrix.goos == 'windows'
        run: |
          ARTIFACT="mifer-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.zip"
          zip -j "$ARTIFACT" "$OUTPUT" 使用教程.md
          echo "ARTIFACT=${ARTIFACT}" >> $GITHUB_ENV

      - name: 打包 Linux (.tar.gz)
        if: matrix.goos == 'linux'
        run: |
          ARTIFACT="mifer-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar -czf "$ARTIFACT" "$OUTPUT" 使用教程.md
          echo "ARTIFACT=${ARTIFACT}" >> $GITHUB_ENV

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: mifer-${{ env.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ARTIFACT }}
          retention-days: 30
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            # 更新：
            - [x] RAG 知识库工具化：新增 knowledge_search（检索）和 knowledge_store（入库）工具，由 MiSummarizer 自主管理知识库
            - [x] RAG 懒加载：Qdrant 连接推迟到首次工具调用，启动不再阻塞，不可用时返回友好提示支持重试
            - [x] 移除 Chat Prompt 自动 RAG 检索：知识库完全交给 Agent 工具自主决策，Chat 层不再触碰 Qdrant
            - [x] Qdrant 跳过版本兼容性检查（SkipCompatibilityCheck），消除 60s 启动超时
            - [x] MiSummarizer 提示词更新：明确知识库用于文档资料，代码文件通过 file_reader 读取
            - [x] RAG 向量存储从 Redis 迁移到 Qdrant（单容器部署，默认持久化，零外部依赖）
            - [x] 新增记忆清空 API 接口，支持生成新会话 ID 并切换
            - [x] 新增系统提示词增查改重置 API，支持自定义提示词与重置默认值
            - [x] 重构配置依赖，统一使用 conf.GetConfig() 全局获取配置
            - [x] 统一错误处理：ErrRAGNotReady 等错误码收归 pkg/errorer 管理
          files: artifacts/**/*
          draft: false
          prerelease: false

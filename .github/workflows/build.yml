name: Build Mifer

on:
  push:
    tags:
      - 'v*'
    
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, linux]
        goarch: [amd64, arm64]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 编译可执行文件
        run: |
          VERSION="${{ github.ref_name }}"
          EXE_EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXE_EXT=".exe"
          fi
          OUTPUT="mifer${EXE_EXT}"
          echo "Building ${OUTPUT} for ${{ matrix.goos }}/${{ matrix.goarch }} (${VERSION})"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-s -w" -o "${OUTPUT}" ./cmd/main
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "OUTPUT=${OUTPUT}" >> $GITHUB_ENV

      - name: 打包 Windows (.zip)
        if: matrix.goos == 'windows'
        run: |
          ARTIFACT="mifer-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.zip"
          zip -j "$ARTIFACT" "$OUTPUT" 使用教程.md docker-compose.yml
          zip -r "$ARTIFACT" docker/
          echo "ARTIFACT=${ARTIFACT}" >> $GITHUB_ENV

      - name: 打包 Linux (.tar.gz)
        if: matrix.goos == 'linux'
        run: |
          ARTIFACT="mifer-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar -czf "$ARTIFACT" "$OUTPUT" 使用教程.md docker-compose.yml docker/
          echo "ARTIFACT=${ARTIFACT}" >> $GITHUB_ENV

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: mifer-${{ env.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ARTIFACT }}
          retention-days: 30
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## 📋 /plan 计划强制执行
            - 新增 `Mode` 字段（`TalkReq`），`/plan` 命令通过 `req.Mode="plan"` 路由到计划流程
            - 新增 **PlanAgent**（只读工具：file_reader/file_viewer/web_search/web_fetch/knowledge_search），sonnet 模型
            - 新增 **PlanGraph**（Eino compose 图）：`PlanAgent(流式) → 写入 .mifer/plans/ → SSE 确认 → 用户审批`
            - PlanAgent 复用 `errorMiddleware` + `confirmMiddleware`，工具事件通过 `aicallback.NewHandler` 转发
            - PlanGraph 流式转发全部事件（thinking/tool_start/tool_end/response/token），TUI 体验与正常对话一致
            - TUI 新增 `plan_confirm` SSE 事件处理：全屏计划预览 → Enter 确认 / Esc 拒绝 → `POST /api/tool/confirm`
            - 计划阶段保留完整对话历史，确认后 Mifer（全工具）按计划执行，两轮 Memory 分别持久化

            ## 🧠 用户习惯总结（HabitGraph）
            - 每轮对话末尾异步调用 Eino Graph：`ChatModel(haiku) → Lambda(全量覆盖 MIFER.md)`
            - 分析本轮对话 + 现有画像 → AI 增量更新用户级 `{CfgPath}/MIFER.md`
            - `HabitInstruction` 常量定义，fire-and-forget 模式不阻塞对话

            ## 🔪 Chat 原子化重构
            - `chat.go` 拆分为 `chat.go`（prepareChat/finalizeChat/Chat） + `chat_run.go`（runConversation/runAgentOnce/handleEvent） + `chat_plan.go`（runPlanFlow）
            - Chat() 主流程精简为 60 行编排逻辑，新增 `pickRunner()` 方法
            - 移除 `chatMu` 全局锁（Memory 内部自带 `mu.Lock` 保护），多 session 不再互相阻塞

            ## 🛠 工具与 Agent 优化
            - `paralleldispatch` 消息收集对齐 chat.go：只取最终 Assistant 回复（`Role==Assistant && ToolCalls==0`）
            - 新增 `ReadOnlyTools()` 工厂（file_reader/file_viewer/web_search/web_fetch/knowledge_search）
            - `CallbackFromCtx` / `SessionIDFromCtx` 导出，供 Lambda 节点等非中间件组件使用
            - 删除旧硬编码子 Agent 文件（MiEditer/MiPlanner 等），改为纯配置驱动
          files: artifacts/**/*
          draft: false
          prerelease: false

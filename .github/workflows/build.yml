name: Build Mifer

on:
  push:
    tags:
      - 'v*'
    
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, linux]
        goarch: [amd64, arm64]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 编译可执行文件
        run: |
          VERSION="${{ github.ref_name }}"
          EXE_EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXE_EXT=".exe"
          fi
          OUTPUT="mifer${EXE_EXT}"
          echo "Building ${OUTPUT} for ${{ matrix.goos }}/${{ matrix.goarch }} (${VERSION})"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-s -w" -o "${OUTPUT}" ./cmd/main
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "OUTPUT=${OUTPUT}" >> $GITHUB_ENV

      - name: 打包 Windows (.zip)
        if: matrix.goos == 'windows'
        run: |
          ARTIFACT="mifer-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.zip"
          zip -j "$ARTIFACT" "$OUTPUT" 使用教程.md
          echo "ARTIFACT=${ARTIFACT}" >> $GITHUB_ENV

      - name: 打包 Linux (.tar.gz)
        if: matrix.goos == 'linux'
        run: |
          ARTIFACT="mifer-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar -czf "$ARTIFACT" "$OUTPUT" 使用教程.md
          echo "ARTIFACT=${ARTIFACT}" >> $GITHUB_ENV

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: mifer-${{ env.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ARTIFACT }}
          retention-days: 30
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            # 更新：
            - [x] 新增 Web 搜索与网页抓取工具（WebSearch / WebFetch），支持互联网信息检索（基于 SearXNG）
            - [x] 新增搜索配置项，支持通过环境变量灵活控制搜索功能
            - [x] 新增 Docker 部署支持——Dockerfile、docker-compose.yml 及生产环境配置
            - [x] 新增 MCP 服务支持，实现 MCP Server 状态查询与外部工具集成（外挂式工具生态）
            - [x] 新增 Skills 技能管理系统，支持 YAML 声明式自定义技能与 /skill 命令
            - [x] Skills 支持 inline（内联）和 fork（分叉）双模式执行
            - [x] 新增 Plan 管理功能——AI 自主编写与查看计划文件（.mifer/plans/）
            - [x] TUI 新增 SSE 流取消支持，Ctrl+C 中断正在生成的对话流
            - [x] 重构 Agent 编排——移除 MiTalker 子 Agent，简化 Agent 体系
            - [x] 重构 SSE 工具，提取通用 SSE Writer 封装
            - [x] 新增默认 MCP Demo Server 配置，开箱即用
          files: artifacts/**/*
          draft: false
          prerelease: false

# Promtail 配置 — 采集 Mifer 日志并发送到 Loki
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /data/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

limits_config:
  max_line_size: 64KB
  
scrape_configs:
  - job_name: mifer-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: mifer
          __path__: /var/log/mifer/*.log
    pipeline_stages:
      # JSON 解析（Mifer 使用 NewJSONEncoder，每行一条 JSON）
      - json:
          expressions:
            time:     time
            level:    level
            caller:   caller
            msg:      msg
            error:    error
            trace_id: trace_id
      # label：仅放低基数字段（level 只有 DEBUG/INFO/WARN/ERROR 四种值）
      - labels:
          level: level
      # structured_metadata：高频查询字段，无需 | json 解析即可过滤/聚合
      - structured_metadata:
          caller:
          error:
          trace_id:
      - timestamp:
          source: time
          format: "01-02 15:04:05.000"
          location: "Asia/Shanghai"

  # ── Gin HTTP 访问日志（文本格式，无 pipeline，使用采集时间） ──
  - job_name: mifer-gin-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: mifer-gin
          __path__: /var/log/mifer/gin.log
